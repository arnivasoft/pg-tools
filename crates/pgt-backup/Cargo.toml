[package]
name = "pgt-backup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# Yürütücü testlerinin sahte aracı. Bağımlılıkların ikilileri uygulamayla derlenmez, dağıtıma girmez.
[[bin]]
name = "pgt-fake-tool"
path = "tests/support/fake_tool.rs"
test = false
bench = false
doc = false

[dependencies]
pgt-core.workspace = true
# `FieldError` ve `Risk` tek TS tipi kalsın diye yeniden kullanılır (döngü yok: pgt-ddl pgt-backup'a bağlı değil).
pgt-ddl.workspace = true
tokio.workspace = true
serde.workspace = true
ts-rs.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
insta.workspace = true
serde_json.workspace = true
# Docker'lı gidiş-dönüş testleri (`tests/roundtrip.rs`): `PGT_TEST_URLS` ve yönetici bağlantısı.
pgt-core = { workspace = true, features = ["testing"] }
tokio-postgres.workspace = true
